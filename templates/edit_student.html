{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Edit Student</h1>
    <p>Update student academic information</p>
</div>

<div class="card">

<form method="POST">

    <div class="form-grid">

        <div class="form-group">
            <label>Student Name</label>
            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required>
        </div>

        <div class="form-group">
            <label>Roll Number</label>
            <input
                type="text"
                name="roll_no"
                value="{{ student.roll_no }}"
                required>
        </div>

        <div class="form-group">
            <label>Class</label>
            <input
                type="text"
                name="class_name"
                value="{{ student.class_name }}"
                required>
        </div>

        <div class="form-group">
            <label>Attendance (%)</label>
            <input
                type="number"
                name="attendance"
                value="{{ student.attendance }}"
                min="0"
                max="100"
                step="0.01"
                required>
        </div>

    </div>

    <h3>Subject Marks</h3>

    <div class="form-grid">

        <div class="form-group">
            <label>Mathematics</label>
            <input
                type="number"
                name="maths"
                value="{{ student.maths }}"
                min="0"
                max="100"
                required>
        </div>

        <div class="form-group">
            <label>Python</label>
            <input
                type="number"
                name="python"
                value="{{ student.python }}"
                min="0"
                max="100"
                required>
        </div>

        <div class="form-group">
            <label>DSA</label>
            <input
                type="number"
                name="dsa"
                value="{{ student.dsa }}"
                min="0"
                max="100"
                required>
        </div>

        <div class="form-group">
            <label>DBMS</label>
            <input
                type="number"
                name="dbms"
                value="{{ student.dbms }}"
                min="0"
                max="100"
                required>
        </div>

        <div class="form-group">
            <label>Computer Networks</label>
            <input
                type="number"
                name="networks"
                value="{{ student.networks }}"
                min="0"
                max="100"
                required>
        </div>

    </div>

    <button type="submit" class="btn btn-primary">
        Update Student
    </button>

    <a href="{{ url_for('students') }}" class="btn">
        Cancel
    </a>

</form>

</div>

{% endblock %}
