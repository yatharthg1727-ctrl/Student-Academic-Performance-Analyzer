{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Add Student</h1>
    <p>Enter student academic details</p>
</div>

<div class="card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" name="roll_no" required>
            </div>

            <div class="form-group">
                <label>Class</label>
                <input type="text" name="class_name" required>
            </div>

            <div class="form-group">
                <label>Attendance (%)</label>
                <input type="number" name="attendance" min="0" max="100" step="0.01" required>
            </div>

        </div>

        <h3>Subject Marks</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Mathematics</label>
                <input type="number" name="maths" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label>Python</label>
                <input type="number" name="python" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label>DSA</label>
                <input type="number" name="dsa" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label>DBMS</label>
                <input type="number" name="dbms" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label>Computer Networks</label>
                <input type="number" name="networks" min="0" max="100" required>
            </div>

        </div>

        <button type="submit" class="btn btn-primary">
            Add Student
        </button>

        <a href="{{ url_for('students') }}" class="btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
