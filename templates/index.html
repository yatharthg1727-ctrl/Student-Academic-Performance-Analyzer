{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Student Academic Performance Analyzer</h1>
    <p>Manage and analyze student academic performance.</p>
</div>

<div class="stats-grid">

    <div class="stat-card">
        <h2>{{ total_students }}</h2>
        <p>Total Students</p>
    </div>

    <div class="stat-card">
        <h2>{{ average_percentage }}%</h2>
        <p>Average Percentage</p>
    </div>

</div>

<div class="card">

    <h2>Quick Actions</h2>

    <br>

    <a href="{{ url_for('add_student') }}" class="btn btn-primary">
        Add Student
    </a>

    <a href="{{ url_for('students') }}" class="btn">
        View Students
    </a>

</div>

{% endblock %}
